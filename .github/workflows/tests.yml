name: Independent oracle and scorer tests

on:
  push:
    paths:
      - '*.py'
      - 'tests/**'
      - 'requirements-ci.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - '*.py'
      - 'tests/**'
      - 'requirements-ci.txt'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-and-mutation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /requirements-ci.txt
            /tests/
            /.github/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependency
        run: python -m pip install -r requirements-ci.txt
      - name: Run hand-authored semantic and corruption tests
        run: python tests/run_tests.py --output test-results
      - name: Retain JSON and JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: independent-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
